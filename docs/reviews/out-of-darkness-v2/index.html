<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Out of Darkness · 第二版视觉</title><style>body{margin:0;background:#090e16;color:#d8e5ef;font:16px/1.7 system-ui;padding:36px}main{max-width:1120px;margin:auto}h1{font-size:27px;font-weight:500;margin:0}p{color:#9fb1bf}section{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}figure{margin:0}img{display:block;width:100%;border-radius:20px}figcaption{padding:12px 0}small{color:#9fb1bf;display:block}a{color:#a3cee5}@media(max-width:800px){section{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){section{grid-template-columns:1fr}body{padding:22px}figure{max-width:390px;margin:auto}}</style><main><h1><i>Out of Darkness</i> · 禅定视觉第二版</h1><p>Aubrey Ashburn · 微信开发者工具真实运行截图。前段自然播放，后段从音频 100 秒恢复后继续播放；主光始终等待实际歌词显示回调。</p><section><figure><img loading="lazy" src="01-开场星点.png"><figcaption>开场保留星点<small>约 0.8 秒：地球仍暗，画面已有星点。</small></figcaption></figure><figure><img loading="lazy" src="02-提前渐显.png"><figcaption>歌名提前渐显<small>约 5.5 秒：歌名仍在渐显，完整显出需到约 7.4 秒。</small></figcaption></figure><figure><img loading="lazy" src="03-暗段绕行光.png"><figcaption>暗段绕行光与掠星<small>约 12 秒：三条不同轨迹持续绕行，上方有慢速掠星。</small></figcaption></figure><figure><img loading="lazy" src="04-太阳散射光.png"><figcaption>太阳散射光峰<small>约 109 秒：歌词触发后，宽而柔的光从地球右上缘照来。</small></figcaption></figure><figure><img loading="lazy" src="05-退光后仍明亮.png"><figcaption>退光后仍明亮<small>约 118 秒：光峰收落，地球保留较亮状态。</small></figcaption></figure></section><p>歌名提前 2 秒，渐显延长至 3.4 秒；增加三条绕行光与慢速掠星。参考登月模式的柔和散射光，形成约 12 秒光峰，然后保持更明亮的地球。</p><p><a href="../../ZEN-OUT-OF-DARKNESS-VISUALS-2026-10-13.md">设计与对齐记录</a> · <a href="runtime.json">最终运行采样</a> · <a href="tests.json">37 项检查结果</a></p></main></html>
