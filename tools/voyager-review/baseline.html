<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅行者号 · 擦肩样片</title><style>*{box-sizing:border-box}body{margin:0;background:#080a0e;color:#bbc3cf;font:14px system-ui;text-align:center}header{padding:16px}h1{font-size:17px;font-weight:500;margin:0 0 8px}p{font-size:12px;color:#7e8a99;margin:6px}canvas{display:block;margin:auto;width:min(100vw,390px);height:auto;max-height:76vh;aspect-ratio:390/720}button{background:#1a222d;border:1px solid #344052;color:#e0e5ed;border-radius:6px;padding:9px 13px;margin:4px}input{width:240px}footer{padding:10px}</style><header><h1>旅行者号 · 擦肩而过</h1><p>NASA 原始模型与贴图 · 14 秒镜头样片</p></header><canvas width="780" height="1440"></canvas><footer><button id="play">重播</button><button id="pause">暂停</button><button id="close">观察模型</button><br><input id="seek" type="range" min="0" max="14" step="0.01" value="0"><span id="clock"></span><p id="status">加载原始模型…</p><p>独立 WebGL 样片 · 尚未作为微信真机验收</p></footer><script>var exports={}</script><script src="/adapter.js"></script><script type="module">
import {registerGLTFLoader} from '/loader.js';
const canvas=document.querySelector('canvas');canvas.createImage=()=>new Image();const T=exports.createScopedThreejs(canvas);registerGLTFLoader(T);
const r=new T.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});r.setSize(780,1440,false);r.gammaOutput=true;r.gammaFactor=2.2;
const scene=new T.Scene(),cam=new T.PerspectiveCamera(43,390/720,.1,300);scene.background=new T.Color(0x010207);
scene.add(new T.AmbientLight(0xb9c6df,.7));const sun=new T.DirectionalLight(0xfff2db,2);sun.position.set(-3,5,7);scene.add(sun);const fill=new T.DirectionalLight(0x8fa9cf,.32);fill.position.set(4,-1,-3);scene.add(fill);
// Deterministic sparse star background, outside the object's travel volume.
let seed=17;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};const points=[];for(let i=0;i<500;i++)points.push((rand()-.5)*95,(rand()-.5)*160,-100-rand()*70);const g=new T.BufferGeometry();g.addAttribute('position',new T.Float32BufferAttribute(points,3));scene.add(new T.Points(g,new T.PointsMaterial({color:0x6f7a91,size:.09,transparent:true,opacity:.6})));
const params=new URLSearchParams(location.search);let model,t=Number(params.get("t")||0),playing=false,inspect=params.has("inspect"),last=performance.now();const status=document.querySelector('#status'),seek=document.querySelector('#seek');
try{const data=await (await fetch('/voyager.glb')).arrayBuffer();const gltf=await new Promise((resolve,reject)=>new T.GLTFLoader().parse(data,'/',resolve,reject));const raw=gltf.scene;raw.updateMatrixWorld(true);const box=new T.Box3().setFromObject(raw),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3());raw.position.sub(center);model=new T.Group();model.add(raw);const scale=4/Math.max(size.x,size.y,size.z);model.scale.setScalar(scale);scene.add(model);playing=!params.has("t")&&!inspect;status.textContent='原始材质已加载 · 相机保持朝前';console.log('Voyager ready',size.toArray(),r.info);}catch(e){status.textContent='加载失败：'+e.message;console.error(e);}
document.querySelector('#play').onclick=()=>{t=0;inspect=false;playing=true};document.querySelector('#pause').onclick=()=>{playing=!playing};document.querySelector('#close').onclick=()=>{inspect=true;playing=false;t=7};seek.oninput=()=>{t=Number(seek.value);inspect=false;playing=false};
function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;if(playing)t=Math.min(14,t+dt);if(t===14&&playing)t=0;if(model){if(inspect){model.position.set(0,0,-8);model.rotation.set(.25,.6,-.22);}else{const u=t/14;model.position.set(.35+1.8*u,.45-.65*u,-22+25*u);model.rotation.set(.2+.12*u,.55+.22*u,-.18+.12*u);}}r.render(scene,cam);seek.value=t;document.querySelector('#clock').textContent=t.toFixed(1)+'s';requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
