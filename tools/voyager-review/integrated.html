<!doctype html><meta charset="utf-8"><title>正式登月 · 三段合并检查</title><style>body{background:#05070c;color:#c7d3e2;text-align:center;font:14px system-ui}canvas{width:390px;height:720px}a{color:#bacddd;padding:10px}</style><p>正式时间线 + 小程序模型数据 · 构图检查（不代替微信验收）</p><nav><a href="?t=27">第一次出现</a><a href="?t=37">地球离场</a><a href="?t=60">深空并行</a><a href="?t=96">月球旁出发</a><a href="?t=108">飞向月面</a></nav><p id="status"></p><button id="play" hidden>正常速度播放高达飞越</button><canvas width="780" height="1440"></canvas><script>var exports={}</script><script src="/adapter.js"></script><script type="module">
const params=new URLSearchParams(location.search),pose=params.get('pose');
const {updateTimeline,VoyageEncounters}=await import('/runtime.js'+(pose?'?pose='+encodeURIComponent(pose)+'&revision=3':''));
const canvas=document.querySelector('canvas');canvas.createImage=()=>new Image();const T=exports.createScopedThreejs(canvas),r=new T.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});r.setSize(780,1440,false);r.gammaOutput=true;
const scene=new T.Scene(),camera=new T.PerspectiveCamera(45,390/720,.1,1000);camera.position.z=5;
const ambient=new T.AmbientLight(0xffffff,.6),light=new T.DirectionalLight(0xffffff,1.2);light.position.set(2,5,8);scene.add(ambient,light);
const loader=new T.TextureLoader(),tex=async url=>new Promise(resolve=>loader.load(url,resolve));
const earth=new T.Mesh(new T.SphereGeometry(1,48,32),new T.MeshPhongMaterial({map:await tex('/earth.jpg')})),globeGroup=new T.Group();globeGroup.add(earth);scene.add(globeGroup);
const moon=new T.Mesh(new T.SphereGeometry(1,48,32),new T.MeshPhongMaterial({map:await tex('/moon.jpg')}));scene.add(moon);
const fx=new VoyageEncounters();fx.setContext({THREE:T,scene,camera,readBuffer:()=>fetch('/voyager-assets/geometry.bin').then(r=>r.arrayBuffer()),readRobotBuffer:()=>fetch('/robot-assets/robot.glb').then(r=>r.arrayBuffer()),readEvaBuffer:unit=>fetch('/'+(unit==='unit01'?'eva01-assets':'eva02-assets')+'/geometry.bin').then(r=>r.arrayBuffer()),readGundamBuffer:()=>fetch(pose?'/pose-assets/'+encodeURIComponent(pose)+'/geometry.bin?revision=3':'/gundam-assets/geometry.bin').then(r=>r.arrayBuffer()),readStarshipBuffer:()=>fetch('/starship-assets/starship.glb').then(r=>r.arrayBuffer())});await fx.preload();await fx.robot.preload();await fx.starship.preload();await fx.gundam.preload();await fx.eva.preload();
const mgr={THREE:T,scene,camera,globeGroup,moonMesh:moon,_moonTexReady:true,_voyageTargetRotY:.85,_startState:{camPos:camera.position.clone(),camRot:camera.rotation.clone(),globePos:globeGroup.position.clone(),globeScale:globeGroup.scale.clone(),ambInt:.6,dirInt:1.2,dirPos:light.position.clone()},_refreshMainStarfieldMesh(){},_companionFx:fx};
const end=Number(params.get('t')||(params.has('play')?79:37));for(let t=0;t<=end;t+=1/60)updateTimeline(mgr,t,1/60);r.render(scene,camera);document.querySelector('#status').textContent=end+' 秒 · 蓝色尾迹 '+(fx.gundam.wake.group.visible?'展开':'结束');
if(params.has('play')) {
  const button=document.querySelector('#play'),stop=Number(params.get('to')||90.5);button.hidden=false;
  button.onclick=()=>{
    button.disabled=true;let time=end,previous=performance.now();
    function tick(now) {
      const dt=Math.min(.05,(now-previous)/1000);previous=now;time=Math.min(stop,time+dt);
      updateTimeline(mgr,time,dt);r.render(scene,camera);
      document.querySelector('#status').textContent=time.toFixed(2)+' 秒 · 正常速度'+(time<stop?'播放':'播放结束');
      if(time<stop)requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  };
}
if(params.has('capture'))await fetch('/capture',{method:'POST',body:JSON.stringify({name:(pose?'pose-'+pose:'integrated')+'-'+end,image:canvas.toDataURL('image/png')})});
</script>
