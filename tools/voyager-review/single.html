<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅行者号 · 擦肩样片</title><style>*{box-sizing:border-box}body{margin:0;background:#080a0e;color:#bbc3cf;font:14px system-ui;text-align:center}header{padding:16px}h1{font-size:17px;font-weight:500;margin:0 0 8px}p{font-size:12px;color:#7e8a99;margin:6px}canvas{display:block;margin:auto;width:min(100vw,390px);height:auto;max-height:76vh;aspect-ratio:390/720}button{background:#1a222d;border:1px solid #344052;color:#e0e5ed;border-radius:6px;padding:9px 13px;margin:4px}input{width:240px}footer{padding:10px}</style><header><h1>旅行者号 · 擦肩而过</h1><p>NASA 原始模型与贴图 · 光照与近距离经过 · 14 秒对照样片</p></header><canvas width="780" height="1440"></canvas><footer><a href="/baseline" style="color:#9baec4">查看原版</a> <button id="play">重播</button><button id="pause">暂停</button><button id="close">观察模型</button><br><input id="seek" type="range" min="0" max="14" step="0.01" value="0"><span id="clock"></span><p id="status">加载原始模型…</p><p>独立 WebGL 样片 · 尚未作为微信真机验收</p></footer><script>var exports={}</script><script src="/adapter.js"></script><script type="module">
import {registerGLTFLoader} from '/loader.js';
const canvas=document.querySelector('canvas');canvas.createImage=()=>new Image();const T=exports.createScopedThreejs(canvas);registerGLTFLoader(T);
const r=new T.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});r.setSize(780,1440,false);r.gammaOutput=true;r.gammaFactor=2.2;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.05;r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene(),cam=new T.PerspectiveCamera(43,390/720,.1,300);scene.background=new T.Color(0x010207);
scene.add(new T.AmbientLight(0xaebed5,.12));const sun=new T.DirectionalLight(0xfff4e6,3.2);sun.position.set(8,6,4);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-5;sun.shadow.camera.right=5;sun.shadow.camera.top=5;sun.shadow.camera.bottom=-5;sun.shadow.camera.near=.1;sun.shadow.camera.far=40;sun.shadow.bias=-.00015;scene.add(sun);scene.add(sun.target);const fill=new T.DirectionalLight(0x789aca,.16);fill.position.set(-6,1,2);scene.add(fill);
// A restrained distant Earth provides scale; no change to the main MV's Earth.
const earthTex=new T.TextureLoader().load('/earth.jpg');earthTex.encoding=T.sRGBEncoding;
const earth=new T.Mesh(new T.SphereBufferGeometry(7,48,32),new T.MeshStandardMaterial({map:earthTex,color:0x8b939f,roughness:1,metalness:0}));earth.position.set(-14,20,-105);earth.rotation.set(.15,2.6,0);scene.add(earth);
const cloudTex=new T.TextureLoader().load('/cloud.png');const clouds=new T.Mesh(new T.SphereBufferGeometry(7.025,48,32),new T.MeshStandardMaterial({color:0x87909d,alphaMap:cloudTex,transparent:true,opacity:.35,depthWrite:false,roughness:1}));earth.add(clouds);
// Low-resolution reflection environment, separate from the visible black sky.
// Dark surrounding space with a small bright solar direction and weak planetary fill.
const faces=[];for(let side=0;side<6;side++){const c=document.createElement('canvas');c.width=c.height=64;const ctx=c.getContext('2d');ctx.fillStyle='#030406';ctx.fillRect(0,0,64,64);if(side===0||side===2){const grad=ctx.createRadialGradient(28,24,1,28,24,25);grad.addColorStop(0,'#b8ada0');grad.addColorStop(.16,'#34383d');grad.addColorStop(1,'#030406');ctx.fillStyle=grad;ctx.fillRect(0,0,64,64);}faces.push(c);}const env=new T.CubeTexture(faces);env.encoding=T.sRGBEncoding;env.needsUpdate=true;

// Deterministic sparse star background, outside the object's travel volume.
let seed=17;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};const points=[];for(let i=0;i<500;i++)points.push((rand()-.5)*95,(rand()-.5)*160,-100-rand()*70);const g=new T.BufferGeometry();g.addAttribute('position',new T.Float32BufferAttribute(points,3));scene.add(new T.Points(g,new T.PointsMaterial({color:0x6f7a91,size:.09,transparent:true,opacity:.6})));
const params=new URLSearchParams(location.search);let model,t=Number(params.get("t")||0),playing=false,inspect=params.has("inspect"),last=performance.now();const status=document.querySelector('#status'),seek=document.querySelector('#seek');
try{const data=await (await fetch('/voyager.glb')).arrayBuffer();const gltf=await new Promise((resolve,reject)=>new T.GLTFLoader().parse(data,'/',resolve,reject));const raw=gltf.scene;raw.updateMatrixWorld(true);const box=new T.Box3().setFromObject(raw),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3());raw.position.sub(center);model=new T.Group();model.add(raw);const scale=4/Math.max(size.x,size.y,size.z);model.scale.setScalar(scale);raw.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;for(const m of (Array.isArray(o.material)?o.material:[o.material])){m.envMap=env;m.envMapIntensity=.32;m.needsUpdate=true;}}});scene.add(model);playing=!params.has("t")&&!inspect;status.textContent='原始材质已加载 · 相机保持朝前';console.log('Voyager ready',size.toArray(),r.info);}catch(e){status.textContent='加载失败：'+e.message;console.error(e);}
document.querySelector('#play').onclick=()=>{t=0;inspect=false;playing=true};document.querySelector('#pause').onclick=()=>{playing=!playing};document.querySelector('#close').onclick=()=>{inspect=true;playing=false;t=7};seek.oninput=()=>{t=Number(seek.value);inspect=false;playing=false};
function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;if(playing)t=Math.min(14,t+dt);if(t===14&&playing)t=0;if(model){if(inspect){model.position.set(0,0,-8);model.rotation.set(.25,.6,-.22);}else{const u=t/14;model.position.set(.12+1.1*u,.25-.35*u,-18+22*u);model.rotation.set(.28+.06*u,.35+.12*u,-.22+.06*u);}sun.target.position.copy(model.position);sun.position.copy(model.position).add(new T.Vector3(8,6,4));}r.render(scene,cam);seek.value=t;document.querySelector('#clock').textContent=t.toFixed(1)+'s';requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
